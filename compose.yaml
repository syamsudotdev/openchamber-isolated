services:
  opencode:
    image: opencode-local:latest
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace
    network_mode: host
    environment:
      OPENCHAMBER_UI_PASSWORD: ${OPENCHAMBER_UI_PASSWORD:?Set OPENCHAMBER_UI_PASSWORD in .env}
      FIGMA_API_KEY: ${FIGMA_API_KEY:-}
      CLAUDE_CODE_ENTRYPOINT: opencode-claude
      NPM_CONFIG_CACHE: /home/node/.cache/npm
      USBMUXD_SOCKET_ADDRESS: UNIX:/run/usbmux-relay/usbmuxd
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: ${OPENCODE_PIDS_LIMIT:-1024}
    mem_limit: ${OPENCODE_MEMORY:-20g}
    memswap_limit: ${OPENCODE_MEMORY_SWAP:-28g}
    cpus: ${OPENCODE_CPUS:-12}
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=${OPENCODE_TMP_SIZE:-1g}
      - /run:rw,nosuid,nodev,size=${OPENCODE_RUN_SIZE:-1g}
    volumes:
      - android-sdk:/opt/android-sdk
      - opencode-home:/home/node
      - ${OPENCODE_CACHE:-./cache}:/home/node/.cache
      - ${OPENCODE_WORKSPACE:-./workspace}:/workspace
      - ${OPENCODE_CONFIG:-./config}:/home/node/.config/opencode
      - ${OPENCODE_DATA:-./data}:/home/node/.local/share/opencode
      - ${HOME}/.local/share/usbmux-relay:/run/usbmux-relay
      - ${IOS_SIGNING_DIR:-./ios-signing}:/home/node/ios-signing:ro
      - ${IOS_ARTIFACTS_DIR:-./ios-artifacts}:/home/node/ios-artifacts
    secrets:
      - ios_p12_password
    stdin_open: true
    tty: true

volumes:
  android-sdk:
  opencode-home:

secrets:
  ios_p12_password:
    file: ${IOS_P12_PASSWORD_FILE:-./ios-signing/p12-password}
