services:
  opencode:
    image: opencode-local:latest
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace
    network_mode: host
    environment:
      OPENCHAMBER_UI_PASSWORD: ${OPENCHAMBER_UI_PASSWORD:?Set OPENCHAMBER_UI_PASSWORD in .env}
      NPM_CONFIG_CACHE: /home/node/.cache/npm
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: ${OPENCODE_PIDS_LIMIT:-1024}
    mem_limit: ${OPENCODE_MEMORY:-20g}
    memswap_limit: ${OPENCODE_MEMORY_SWAP:-28g}
    cpus: ${OPENCODE_CPUS:-12}
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=${OPENCODE_TMP_SIZE:-1g}
      - /run:rw,nosuid,nodev,size=${OPENCODE_RUN_SIZE:-1g}
      - /opt/android-sdk/.sdk:rw,nosuid,nodev,uid=1000,gid=1000,mode=0755
    volumes:
      - opencode-home:/home/node
      - ${OPENCODE_CACHE:-./cache}:/home/node/.cache
      - ${OPENCODE_WORKSPACE:-./workspace}:/workspace
      - ${OPENCODE_CONFIG:-./config}:/home/node/.config/opencode
      - ${OPENCODE_DATA:-./data}:/home/node/.local/share/opencode
    stdin_open: true
    tty: true

volumes:
  opencode-home:
