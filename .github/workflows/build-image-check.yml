name: Build image check

on:
  schedule:
    - cron: '0 20 * * *'
      timezone: America/Los_Angeles
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-image-check-main
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '26.x'
          check-latest: true
      - name: Test
        run: |
          sh tests/bootstrap.sh
          sh tests/install-tools.sh
          sh tests/android-install.sh
          node --test tests/rtk-plugin.mjs
      - name: Build with the latest tools
        run: docker build --pull --no-cache --platform linux/amd64 -t openchamber-build-check .
      - name: Record installed versions
        run: |
          {
            printf '%s\n' '## Installed versions' '' '```text'
            docker run --rm --platform linux/amd64 --entrypoint cat openchamber-build-check /usr/local/share/image-versions.txt
            printf '%s\n' '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Check the runtime
        run: sh tests/android-runtime.sh openchamber-build-check
